[package]
name = "animfetch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "animfetch"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
