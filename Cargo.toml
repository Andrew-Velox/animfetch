[package]
name = "animfetch"
version = "0.1.4"
edition = "2024"
# Let chains, which the loading and terminal-size paths both use. Stated so an
# older toolchain fails with a version error rather than a syntax one. The
# README tells people 1.88, and this is what enforces it.
rust-version = "1.88"
repository = "https://github.com/Andrew-Velox/animfetch"

[[bin]]
name = "animfetch"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
