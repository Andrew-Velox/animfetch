name: release

# Publishing is what makes animfetch installable without a Rust toolchain. Push
# a tag and this attaches ready-to-run binaries to a GitHub Release, which is
# where `install.sh` fetches from.
on:
  push:
    tags: ['v*']
  # Re-run against an existing tag if a release needs rebuilding. Check out the
  # tag itself when dispatching, not a branch. The version comes from the ref.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # One architecture failing should not hide whether the other worked.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # GitHub retired the free Intel macOS runners, so this one is
          # cross-compiled on the arm runner and smoke tested under Rosetta
          # when the image provides it.
          - target: x86_64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Linux ships musl, not glibc: a glibc binary refuses to start on any
      # distro older than the runner, which defeats shipping a binary at all.
      # macOS links the OS-stable libSystem, so its binaries need nothing
      # special. Every dependency is pure Rust either way. See `cargo tree`.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable
          rustc --version

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the binary is actually static
        if: contains(matrix.target, 'musl')
        run: |
          bin=target/${{ matrix.target }}/release/animfetch
          file "$bin"
          # A dynamically linked result would defeat the purpose, so fail here
          # rather than ship something that breaks on the user's machine.
          if ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "::error::$bin is dynamically linked"
            exit 1
          fi

      # Native everywhere except x86_64 macOS, which runs under Rosetta when
      # the runner image has it and is skipped (loudly) when it does not.
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/animfetch
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::warning::no Rosetta on this runner; x86_64-apple-darwin binary is untested"
              exit 0
            fi
          fi
          "$bin" --version
          "$bin" --list
          "$bin" --once

      - name: Package
        run: |
          name=animfetch-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/animfetch "dist/$name/"
          cp README.md config.example.toml LICENSE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history and tags: the changelog walks commits back to the
      # previous tag, and the default shallow checkout has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One combined file, because that is what `install.sh` fetches to verify
      # whichever tarball it picked.
      - name: Collect checksums
        run: |
          cd dist
          cat ./*.tar.gz.sha256 > SHA256SUMS
          rm ./*.tar.gz.sha256
          cat SHA256SUMS

      # `gh` is preinstalled on the runner, so this needs no third-party action
      # holding a token that can write to the repository.
      # Quoted heredoc so backticks stay literal, then substitute the version.
      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Animated system fetch that stays pinned above your shell while you work.

          ## Install

          Arch Linux:

          ```sh
          paru -S animfetch-bin
          ```

          Any Linux or macOS, prebuilt binary, no Rust needed:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/Andrew-Velox/animfetch/main/install.sh | sh
          ```

          ## Binaries

          The Linux builds are static musl, so they run on any distribution
          regardless of its glibc version. Check a download against `SHA256SUMS`.

          | File | For |
          | --- | --- |
          | `animfetch-__VER__-x86_64-unknown-linux-musl.tar.gz` | Linux, Intel and AMD |
          | `animfetch-__VER__-aarch64-unknown-linux-musl.tar.gz` | Linux, ARM |
          | `animfetch-__VER__-aarch64-apple-darwin.tar.gz` | macOS, Apple Silicon |
          | `animfetch-__VER__-x86_64-apple-darwin.tar.gz` | macOS, Intel |
          EOF
          sed -i "s/__VER__/${GITHUB_REF_NAME}/g" notes.md

          # Conventional-commit changelog since the previous tag. Commits the
          # workflows write themselves are dropped: they tell a reader nothing.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          noise='^(chore: update stargazers mural|docs: update lines of code stats)[[:space:]]'

          section() {
            body=$(
              git log --no-merges --format='%s%x09%h' "$range" \
              | grep -Ev "$noise" \
              | grep -E "^($2)(\([^)]*\))?!?:" \
              | sed -E "s#^[a-z]+(\([^)]*\))?!?:[[:space:]]*(.*)\t(.*)#- \2 [\`\3\`](https://github.com/$GITHUB_REPOSITORY/commit/\3)#" \
              || true
            )
            if [ -n "$body" ]; then
              printf '### %s\n\n%s\n\n' "$1" "$body" >> notes.md
            fi
            return 0
          }

          printf '\n## Changelog\n\n' >> notes.md
          section 'Features'      'feat'
          section 'Fixes'         'fix'
          section 'Performance'   'perf'
          section 'Documentation' 'docs'
          section 'Internal'      'refactor|ci|build|test|chore|style'

          if [ -n "$prev" ]; then
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi

          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/* \
          || { gh release upload "$GITHUB_REF_NAME" dist/* --clobber; \
               gh release edit "$GITHUB_REF_NAME" --notes-file notes.md; }
