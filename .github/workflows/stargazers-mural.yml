name: Generate Stargazers Mural

# Config lives in .github/contributor-mural.yml, which is where the action
# looks by default.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A scheduled run and a manual one at the same time would race on the commit.
concurrency:
  group: stargazers-mural

jobs:
  generate-mural:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The action commits the SVG itself, so there is no separate commit step.
      # `token` is an input, not an environment variable.
      - name: Generate Stargazers Mural
        uses: crystal-actions/contributor-mural@v1.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore: update stargazers mural"
