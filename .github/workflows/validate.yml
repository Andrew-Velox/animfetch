name: Validate Markdown & Count LOC

on: [push, pull_request]

# git-auto-commit-action pushes back to the repo, which the default read-only
# token cannot do.
permissions:
  contents: write

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install my_github_cli
        run: cargo install --git https://github.com/Andrew-Velox/my_github_cli.git

      - name: Validate Markdown Files
        run: my_github_cli --ext md .

      - name: Update README with LOC
        run: |
          # --ext matters: it defaults to "." which matches nothing, so leaving
          # it off counts zero lines. The tool also prints a banner and the whole
          # link report, so take only the number.
          LOC=$(my_github_cli --ext rs --loc . | grep -oP 'Total lines of code:\s*\K\d+')
          if [ -z "$LOC" ]; then
            echo "::error::could not parse a line count out of my_github_cli"
            exit 1
          fi

          export LOC_STATS="![Lines of Rust](https://img.shields.io/badge/lines_of_Rust-$LOC-orange?style=flat-square)"

          # Deliberately not anchored to newlines. The markers sit on consecutive
          # lines, and requiring one between them is what stopped this matching.
          #
          # The blank lines matter: the markers follow an <hr>, and without a gap
          # the whole run becomes one HTML block, where Markdown is not parsed.
          perl -0777 -pi -e \
            's/(<!-- loc-start -->).*?(<!-- loc-end -->)/$1\n\n$ENV{LOC_STATS}\n\n$2/s' README.md

          if git diff --quiet README.md; then
            echo "::warning::README unchanged; are the loc-start/loc-end markers present?"
          else
            git diff README.md
          fi

      # Only on push: a pull_request from a fork cannot be written back to.
      - name: Commit changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update lines of code stats"
          file_pattern: README.md
