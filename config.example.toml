# animfetch configuration.
#
# Copy to ~/.config/animfetch/config.toml. Every key is optional; anything you
# leave out keeps its default, and an unreadable file falls back to defaults
# with a warning rather than refusing to start.

# Animation to play. `animfetch --list` shows what is available, and
# `animfetch --set <name>` rewrites this line for you.
# "cat-run" is built into the binary; a directory of the same name overrides it.
# Any other name must exist on disk, or animfetch reports it rather than
# silently falling back.
animation = "cat-run"

# Frames per second. Clamped to 1-120.
fps = 12.0

# Largest box, in cells, the art may occupy. It scales to fit inside both while
# keeping its aspect ratio, so animations of different proportions still come
# out a consistent size. Set either to 0 to fill the available space.
#
# Both matter: a wide, short animation slips under a height cap untouched and
# would otherwise render at its full width.
width = 56
height = 20

# Draw the animation. Set false for the info alone (and any border), which is
# how the `minimal` style looks beside an ornament. `--no-art` for one run.
art = true

# How long `animfetch --play` animates before handing back to your shell.
play_seconds = 3.0

# Keep the rows whose numbers move (uptime, memory, swap, disk) current while
# the fetch is on screen, instead of showing what they were at startup.
#
# Applies to `--pin` and the interactive mode. `--play` is too short to matter
# and `--once` is a single frame, so neither refreshes. Nothing is read while a
# full-screen program such as vim has the terminal, rows are never added or
# removed, and the art is never resized by a changing number.
#
# Off by default. `animfetch --pin --live` turns it on for one run.
live = false

# Seconds between refreshes when `live` is on. Clamped to 0.5-60. Each refresh
# is a couple of file reads, and only rows whose text changed are repainted.
live_interval = 2.0

# How the art is drawn.
#
#   half  Two vertical samples per cell, drawn with half blocks (▀▄█). Solid
#         glyphs only, so edges are crisp and small holes stay holes.
#   quad  Four samples per cell in a 2x2 grid (▘▝▖▗▚▞…). Twice the resolution
#         of half in both directions, for art with fine detail.
#   ramp  One sample per cell, mapped onto `ramp` below by density. Use it for
#         a classic ASCII look, but note the shaded blocks are stipple
#         patterns in most fonts, which reads as noise along edges.
#   raw   The art's own characters, exactly as authored. For hand-drawn ASCII
#         whose glyphs are the picture rather than a silhouette, like `earth`.
#         When shrinking, it keeps thin strokes by picking an inked cell from
#         each block rather than a blind fixed sample.
style = "half"

# Only used when style = "raw" and the frames carry SGR colours of their own.
#
#   "own"    show the art's real embedded colours (default)
#   "theme"  ignore them and paint the art with the gradient above, exactly
#            like escape-free art
#
# The info pane always uses the theme colours either way.
art_color = "own"

# Only used when style = "ramp". Lowest ink coverage first.
# Try " .:-=+*#%@" for classic ASCII, or " █" for hard edges.
ramp = " ░▒▓█"

# Vertical colour ramp down the art. An empty list leaves the art uncoloured.
gradient = ["#f5c95c", "#f17f5b", "#f45c82", "#b07cf4", "#74a4ff"]

# Animate the gradient so it crawls through the art as it plays.
gradient_scroll = false

# Info pane colours.
accent = "#74a4ff"   # user@host, the rule, and labels
value  = "#c8ccd4"   # values

# Where the three colours above come from.
#
#   "config"   exactly as written above (default)
#   "palette"  look them up in whatever file themes your desktop, so the fetch
#               follows your wallpaper. Anything the file does not define keeps
#               the value above, so this can only add colour, never remove it.
#
# Try it without editing anything: animfetch --once --palette
color_source = "config"

# Candidate palette files, most preferred first; the first that exists wins.
palette_files = [
  "~/.local/state/quickshell/user/generated/colors.json",  # matugen
  "~/.cache/wal/colors.json",                              # pywal
  "~/.cache/wallust/colors.json",                          # wallust
]

# Which names to read out of that file. These defaults are Material You role
# names, as written by matugen. pywal and wallust name theirs color0..color15
# instead, so with those you want something like:
#
#   palette_accent   = "color4"
#   palette_value    = "color7"
#   palette_gradient = ["color4", "color5", "color6"]
palette_accent   = "primary"
palette_value    = "on_surface"
palette_gradient = ["primary", "secondary", "tertiary"]

# Under --pin the palette file is re-read when it changes, so retheming your
# desktop recolours the running animation without restarting it.

# How the info pane looks.
#
#   "classic"  user@host, a rule, then `Label: value` rows (default)
#   "boxed"    short lowercase labels with icons in a rounded box, values
#              beside it, usage percentages coloured by how full they are:
#
#                ╭──────────╮
#                │  distro  │  Arch Linux x86_64
#                │  memory  │  4.39 GiB / 15.56 GiB (28%)
#                ╰──────────╯
#
#   "tree"     a user box over two groups, OS and PC, each a tree of icons
#              beside a column of `: value` lines:
#
#                ┏━━━━━━━┓ ┏━━━━━━━━━━━━━━━━┓
#                ┃   ┃ ┃ : harsh@fedora ┃
#                ┗━━━━━━━┛ ┗━━━━━━━━━━━━━━━━┛
#                ┏━━━━━━━┓ ┏━━━━━━━━━━━━━━━━┓
#                ┃  OS  ┃ ┃ : Fedora Linux ┃
#                ┃ │ ├─ ┃ ┃ : zsh 5.9      ┃
#                ┃ └ └─ ┃ ┃ : kitty 0.44.0 ┃
#                ┗━━━━━━━┛ ┗━━━━━━━━━━━━━━━━┛
#
#              It draws a fixed set of rows: os, shell and terminal under OS;
#              host (or cpu, if the firmware gives no host name), gpu, memory
#              and display under PC. Other modules are not shown in it.
#
#   "sections" titled blocks separated by rules, with the colours as dots:
#
#                ┌──────── Hardware ────────┐
#                 PC: 20L5S1R500 (ThinkPad T480)
#                 ├─  Intel(R) Core(TM) i7-8650U
#                 └─  /home: 12.12 GiB / 294.23 GiB
#                ├──────── Software ────────┤
#                 OS: Artix Linux x86_64
#                ├─────── Uptime / Age ──────┤
#                OS Age  : 337 days
#                Battery : 100% [AC Connected]
#
#              Three fixed blocks: Hardware (host, cpu, gpu, memory, and every
#              local disk), Software (os, kernel, packages, shell, wm) and
#              Uptime / Age (os_age, uptime, and each battery).
#
#   "chips"    filled, rounded pills: a heading chip per section, a two-letter
#              key chip and a value chip per row, the colours as dots:
#
#                ( SYSTEM )
#                ( OS ) ( Arch Linux )
#                ( KE ) ( 6.18.7-arch1-1 )
#
#              Section headings are filled with `accent`; chips are the
#              `value` colour darkened, so it follows the palette. Rounded ends
#              need both `icons` and colour, and are square without either.
#              Three fixed blocks: SYSTEM (os, kernel, uptime, packages),
#              SOFTWARE (wm, shell, terminal, font) and HARDWARE (cpu, gpu,
#              memory, disk). Values are short: no versions, no percentages.
#
#   "iconic"  a bare coloured icon per row and no labels, under pill headings,
#              with a row of outline shapes below:
#
#                 mehedi
#                 3days 18hours 45mins 1sec
#
#                ( Hardware )
#
#                 1366x768
#                 2150MiB used (36%)
#                 60.00°C
#
#              Icons are coloured along `gradient`, one after another, and
#              the headings are filled from it, so it follows a palette. The
#              user's name stands alone (no host). Two fixed blocks: Hardware
#              (display, gpu, memory, swap, cpu, temperature) and Software
#              (kernel, wm, shell_path, packages). With `icons = false` each
#              row carries a short name instead, since the icon was the label.
#
#   "card"    one rounded box with each label at the left edge and its value
#              at the right, then a line of your own text (`footer`):
#
#                ╭──────────────────────────────╮
#                │                              │
#                │   OS              CachyOS    │
#                │   Ram    4.23 / 31.25 GiB    │
#                │   Root   46 / 928 GiB - btrfs│
#                │                              │
#                │        we are free!          │
#                ╰──────────────────────────────╯
#
#              Rows go in the order of `modules`, so it is a list you shape.
#              Memory is `Ram`, and each disk is named for where it is mounted
#              (`/` is `Root`, `/mnt/Jogos` is `Jogos`). Values are short and
#              bare, in a single colour: your `value`.
#
#   "minimal"  an icon and a value per row and nothing else: no title, no
#              labels, no frame, one colour. The plain list that sits beside a
#              border ornament:
#
#                 Arch Linux x86_64
#                 Linux 7.2.6-arch2-1
#                 mango (Wayland)
#                 zsh 5.9.2
#
#              Rows go in the order of `modules`, so it is a list you shape.
#              Values are the fuller ones (versions, the session), since with
#              no labels the value has to say what it is. To match the
#              reference look, turn the animation off (`art = false`) and add
#              a border (`border_left`, `border_bottom`).
#
# `boxed`, `tree`, `sections` and `minimal` also read fuller values: the kernel's name,
# and the terminal's, shell's and window manager's versions. Versions of the
# shell and window manager come from running them, which costs a few
# milliseconds that `classic` never spends. `chips`, `iconic` and `card` read
# nothing extra. Try one with --info boxed, tree, sections, chips, iconic or
# card.
info_style = "classic"

# Draw an icon beside each label in styles that have them. They are Nerd Font
# glyphs: set this to false if you see empty boxes instead.
icons = true

# Blank columns between the art and the info pane.
gap = 4

# Set false to disable colour. It is forced off anyway when stdout is not a
# terminal or NO_COLOR is set.
color = true

# Draw in shades of grey: colour is sent, with no hue in it, so the light and
# dark of the art and the text stay. The same as --no-color; --def-color puts
# the default colours back. `color = false` is the other way to have no colour:
# no colour codes at all, so the terminal's own.
gray = false

# Rows in the info pane, in order. Leave this out to get the rows that suit
# `info_style`; set it and your list wins, whichever style is chosen.
# Available: os, host, kernel, uptime, packages, shell, shell_path, wm,
#            terminal, font, cpu, temperature, gpu, memory, swap, disk, disks,
#            display, battery, os_age, custom, colors
#
# `disk` is the root filesystem. `disks` is every local one, a row each, and
# `battery` a row per battery; a machine without one shows none. `shell_path`
# is the full path of $SHELL where `shell` is its name, and `temperature` the
# CPU's, from the hwmon chip that reports it (`k10temp`, `coretemp`, ...); a
# machine whose sensors are not among those has none. `font` is
# the desktop's UI font, read from GTK's settings.ini, so a machine that keeps
# it only in dconf shows no font row.
#
# classic default:
#   modules = ["os", "host", "kernel", "uptime", "packages", "shell", "wm",
#              "terminal", "cpu", "memory", "swap", "disk", "colors"]
# boxed default:
#   modules = ["os", "kernel", "wm", "terminal", "shell", "cpu", "gpu", "disk",
#              "memory", "uptime", "os_age"]
# tree default:
#   modules = ["os", "shell", "terminal", "host", "cpu", "gpu", "memory",
#              "display"]
# sections default:
#   modules = ["host", "cpu", "gpu", "memory", "disks", "os", "kernel",
#              "packages", "shell", "wm", "os_age", "uptime", "battery",
#              "colors"]
# minimal default:
#   modules = ["os", "kernel", "wm", "shell", "terminal", "cpu", "gpu",
#              "memory", "os_age"]
# card default:
#   modules = ["os", "kernel", "uptime", "shell", "wm", "os_age", "memory",
#              "cpu", "disks", "packages", "custom"]
# iconic default:
#   modules = ["uptime", "display", "gpu", "memory", "swap", "cpu",
#              "temperature", "kernel", "wm", "shell_path", "packages",
#              "colors"]
# chips default:
#   modules = ["os", "kernel", "uptime", "packages", "wm", "shell",
#              "terminal", "font", "cpu", "gpu", "memory", "disk", "colors"]

# An ornament drawn down the left of the data (between the art and the info),
# and another along the bottom of it: PNG line art, drawn as the picture it is
# in a terminal that speaks the kitty graphics protocol (kitty, WezTerm,
# Ghostty). Other terminals, VS Code's included, get no border.
#
# Each is the name of a built-in image (`animfetch --list-borders` shows them,
# numbered 00, 01, 02, ...), of one of your own, or a path to a PNG. Any image
# can go on either edge. Your own go in `~/.config/animfetch/border/`, and
# shadow a built-in of the same name; a file in `border/left_border/` or
# `border/bottom_border/` is for that edge only. Empty means none.
#
# The art and the info give up the room a border takes. It is skipped on a
# terminal under 60 columns, and with no colour (a pipe, NO_COLOR).
#
# The left image is drawn as it is. The bottom one is turned a quarter
# clockwise so it lies along the bottom, so draw it upright, with the end that
# should be at the right at the top.
#
# border_left   = "00"
# border_bottom = "03"

# How borders are drawn:
#   "auto"   the pictures, where the terminal can show them, else no border
#   "image"  the pictures, even where they are not detected
#   "cells"  the image redrawn as braille characters: coarse, but it works in
#            any terminal with colour. Never chosen for you.
#
# border_render = "auto"

# How far to raise the bottom ornament toward the info, in rows. May be a
# fraction: 0.5 is half a row. 0 puts it flush under the last row, and values
# are capped at 3. Only pictures can be raised by part of a row; cells cannot.
#
# border_bottom_lift = 2.15

# How far to move the bottom ornament to the right, in columns. May be a
# fraction: 0.5 is half a column. 0 starts it flush with the left border, and
# values are capped at 24. The picture is narrowed by as much as it is moved, so
# it never runs past the edge of the terminal. Only pictures move by part of a
# column; cells move by whole ones.
#
# border_bottom_shift = 12.0

# Rows of your own, from text or from a command. They are placed wherever
# `custom` stands in `modules`, so `modules = ["os", "custom", "kernel"]` puts
# them between the two. Only the styles that list rows freely show them:
# classic, boxed and card. A row with an empty label is skipped. Give each
# either a `value` or a `command`, not both.
#
# custom = [
#   { label = "Owner", value = "POKKITA" },
#   { label = "Public IP", command = "curl -s --max-time 1 ifconfig.me" },
# ]

# Change a built-in row. Keyed by the module names `modules` takes; each of
# `label`, `value` and `command` is optional, but one has to be there, and
# `value` and `command` are alternatives.
#
#   label    the name shown for the row. Only the name: the row keeps its icon
#            and its place.
#   value    text shown instead of what the machine reports. Replaces any
#            figures or bars a style would draw for the row, and the row is
#            no longer refreshed by `live`.
#   command  a shell command; the first non-empty line it prints is the value.
#            It runs with your privileges, once, at startup. Nothing printed,
#            or longer than `command_timeout`, leaves the row out.
#
# [overrides.os]
# label = "Distro"
#
# [overrides.kernel]
# value = "my-own-kernel 1.0"
#
# [overrides.uptime]
# label = "Up"
# command = "uptime -p"

# Seconds a `command` may take before its row is left out. Commands start
# together, so this bounds all of them at once. Clamped to 0.1-10.
#
# command_timeout = 1.0

# A line of your own text, shown under the rows by the styles that have room
# for one (currently `card`). Wide characters are measured by what they occupy.
#
# footer = "we are free!"
